# Render Blueprint — one free web service (API + website + app).
# Render → New → Blueprint → pick this repository. Fill the "sync: false" values when asked.
services:
  - type: web
    name: makon
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --app-dir backend app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ANDROID_PACKAGE
        sync: false
      - key: ANDROID_SHA256
        sync: false
